name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI RAG)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Smoke test API (SQLite, seed docs, extractive answer)
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8002/api/health && break || sleep 1; done
          echo
          curl -sf -X POST http://127.0.0.1:8002/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"How many PTO days do Helios employees receive?"}' | head -c 400
          echo

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
